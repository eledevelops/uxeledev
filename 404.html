<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Eleazar Madera</title>
    <meta name="robots" content="noindex" />

    <!-- Inter Tight is self-hosted (@fontsource-variable/inter-tight, imported in src/index.css).
         Preload the Latin file so it downloads in parallel with the CSS; Vite rewrites this path
         to the hashed file in /assets at build time (the same file the CSS uses). -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin />
    <!-- The site's Tailwind CSS and design tokens (Vite builds this page too, see vite.config.js) -->
    <link rel="stylesheet" href="/src/index.css" />

    <script>
      try {
        const saved = localStorage.getItem("theme");
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved === "dark" || (!saved && systemDark)) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <!-- Ambient dot texture behind the page (same as the homepage, see src/lib/bodyTexture.js) -->
    <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
      <canvas id="body-texture" class="[image-rendering:pixelated]"></canvas>
    </div>
    <main class="flex min-h-svh flex-col items-center justify-center gap-8 px-6 py-16 text-center">
      <div class="w-full md:w-fit">
        <p class="text-center text-body-lg text-foreground md:text-left md:text-intro">{ 404 }</p>
        <!-- Same moving coral gradient as FlowText: the WebGL canvas behind, the text box blends with it -->
        <div class="relative mix-blend-multiply dark:mix-blend-screen">
          <canvas id="flow-gradient" aria-hidden="true" class="absolute inset-0 size-full"></canvas>
          <h1
            class="relative bg-white text-heading-2xl text-black mix-blend-screen md:text-hero xl:text-display dark:bg-black dark:text-white dark:mix-blend-multiply">
            Whoa!
          </h1>
        </div>
      </div>
      <p class="max-w-modal text-body text-muted-foreground">
        This page doesn't exist. The water was shallower than it looked.
      </p>
      <!-- Same look as components/Button.jsx (hover: a lighter gradient fades in, plus a soft shadow) -->
      <a
        href="/"
        class="group relative isolate overflow-hidden rounded-lg bg-linear-to-r from-coral-300 from-38% to-coral-600 to-94% px-4 py-3 text-body-bold text-white transition-shadow duration-base ease-out hover:shadow-button focus-visible:shadow-button">
        <span
          aria-hidden="true"
          class="absolute inset-0 -z-10 bg-linear-to-r from-coral-300 via-coral-200 to-coral-600 opacity-0 transition-opacity duration-base ease-out group-hover:opacity-100 group-focus-visible:opacity-100"></span>
        Back home
      </a>
    </main>
    <script type="module" src="/src/notFound.js"></script>
  </body>
</html>
