<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eleazar Madera — Front-End Developer</title>
    <meta
      name="description"
      content="Front-end developer with 10+ years of experience engineering brands, campaigns and the websites that carry them. React, GSAP, WebGL and design systems." />
    <link rel="canonical" href="https://uxele.dev/" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <!-- Share previews: LinkedIn, Slack, iMessage, Facebook, WhatsApp… -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://uxele.dev/" />
    <meta property="og:site_name" content="uxele.dev" />
    <meta property="og:title" content="Eleazar Madera — Front-End Developer" />
    <meta
      property="og:description"
      content="Front-end developer with 10+ years of experience engineering brands, campaigns and the websites that carry them." />
    <meta property="og:image" content="https://uxele.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Eleazar sitting on a stone bench over calm water at sunrise" />

    <!-- X / Twitter: reuses the og: tags above, this line asks for the large image card -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- For AI assistants and LLM crawlers: a plain-text guide to the site -->
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="llms.txt" />

    <!-- Structured data (schema.org JSON-LD): who Ele is, for Google and AI assistants.
         Crawlers read this without running JavaScript. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://uxele.dev/#person",
            "name": "Eleazar Madera",
            "alternateName": "Ele",
            "jobTitle": "Front-End Developer",
            "description": "Front-end developer with 10+ years of experience engineering brands, campaigns and the websites that carry them.",
            "url": "https://uxele.dev/",
            "image": "https://uxele.dev/og-image.jpg",
            "email": "mailto:hello@uxele.dev",
            "sameAs": ["https://www.linkedin.com/in/eleazar-madera-451163105/", "https://github.com/eledevelops"],
            "knowsLanguage": ["English", "Spanish"],
            "knowsAbout": [
              "Front-end development",
              "React",
              "JavaScript",
              "HTML",
              "CSS",
              "Tailwind CSS",
              "GSAP",
              "WebGL",
              "WordPress",
              "Figma",
              "Design systems",
              "Brand identity",
              "Website globalization",
              "Photography and video production"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://uxele.dev/#website",
            "url": "https://uxele.dev/",
            "name": "uxele.dev",
            "inLanguage": "en",
            "publisher": { "@id": "https://uxele.dev/#person" }
          },
          {
            "@type": "ProfilePage",
            "@id": "https://uxele.dev/#profile",
            "url": "https://uxele.dev/",
            "name": "Eleazar Madera — Front-End Developer",
            "isPartOf": { "@id": "https://uxele.dev/#website" },
            "mainEntity": { "@id": "https://uxele.dev/#person" }
          }
        ]
      }
    </script>

    <!-- Inter Tight is self-hosted (@fontsource-variable/inter-tight, imported in src/index.css).
         Preload the Latin file so it downloads in parallel with the CSS; Vite rewrites this path
         to the hashed file in /assets at build time (the same file the CSS uses). -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin />

    <script>
      try {
        const saved = localStorage.getItem("theme");
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved === "dark" || (!saved && systemDark)) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
